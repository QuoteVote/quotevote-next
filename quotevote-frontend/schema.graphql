# Snapshot of the new quotevote-backend executable schema.
# Regenerate from quotevote-backend/app/data/schema.ts after the staging API is available.
# Used by scripts/validate-graphql.mjs to catch documents that would 400 at runtime.

enum AccountStatus {
  active
  disabled
  pending
  suspended
}

"""Paginated list of activity feed entries."""
type Activities {
  entities: [Activity]
  pagination: Pagination
}

"""Activity feed entry — a user action on a post/vote/quote/comment."""
type Activity {
  _id: String
  activityType: ActivityEventType
  comment: Comment
  commentId: String
  content: String
  created: Date
  post: Post
  postId: String
  quote: Quote
  quoteId: String
  user: User
  userId: String
  vote: Vote
  voteId: String
}

input ActivityEventInput {
  payload: JSON!
  timestamp: String
  type: String!
}

enum ActivityEventType {
  COMMENTED
  DOWNVOTED
  LIKED
  POSTED
  QUOTED
  UPVOTED
  VOTED
}

"""Result of declining a request or removing a buddy."""
type BuddyMutationResult {
  _id: String!
  success: Boolean!
}

"""A buddy request or accepted buddy pair."""
type BuddyRelationship {
  _id: String!
  acceptedAt: Date
  createdAt: Date!
  recipient: BuddyUser!
  requester: BuddyUser!
  status: BuddyStatus!
}

enum BuddyStatus {
  accepted
  pending
}

"""Public subset of a user shown in buddy lists and requests."""
type BuddyUser {
  _id: String!
  avatar: JSON
  name: String
  username: String
}

"""Buddy user joined with their current presence."""
type BuddyWithPresence {
  presence: Presence
  user: BuddyUser!
}

"""Lightweight chat-room list-view projection of a MessageRoom."""
type ChatRoom {
  _id: ID!
  created: Date
  messageType: String
  unreadMessages: Int
  user: User
  users: [String]
}

"""Comment attached to a post, aligned with Prisma Comment."""
type Comment {
  _id: String
  content: String
  created: Date
  deleted: Boolean
  endWordIndex: Int
  post: Post
  postId: String
  reaction: String
  startWordIndex: Int
  url: String
  user: User
  userId: String
}

input CommentInput {
  content: String!
  endWordIndex: Int!
  postId: String!
  quote: String
  reaction: String
  startWordIndex: Int!
  url: String
  userId: String!
}

type Content {
  _id: String
  created: Date
  creator: Creator
  creatorId: String
  domainId: String
  score: Int
  text: String
  title: String
  url: String
}

type Creator {
  _id: String
  created: Date
  name: String
  profileImageUrl: String
  score: Int
}

"""ISO-8601 date string (also accepts epoch ms on input)."""
scalar Date

"""DateTime scalar type"""
scalar DateTime

"""Response payload for a soft-deleted Comment mutation."""
type DeletedComment {
  _id: String
}

"""Response payload for a soft-deleted Message mutation."""
type DeletedMessage {
  _id: String
}

"""Response payload for a soft-deleted Post mutation."""
type DeletedPost {
  _id: String
}

"""Response payload for a soft-deleted Quote mutation."""
type DeletedQuote {
  _id: String
}

"""Response payload for a removed roster entry."""
type DeletedRoster {
  _id: String!
  success: Boolean!
}

"""Response payload for a soft-deleted Vote mutation."""
type DeletedVote {
  _id: String
}

"""Response from a presence heartbeat mutation."""
type HeartbeatResponse {
  status: PresenceStatus
  statusMessage: String
  success: Boolean!
  timestamp: Date!
}

enum InviteStatus {
  accepted
  declined
  expired
  pending
}

"""Arbitrary JSON value (objects, arrays, primitives)."""
scalar JSON

"""Chat / direct-message entry."""
type Message {
  _id: ID!
  created: Date
  deleted: Boolean
  messageRoom: MessageRoom
  messageRoomId: String
  mutation_type: String
  presence: Presence
  reactions: [Reaction]
  readBy: [String]
  readByDetailed: [ReadByDetailedEntry]
  text: String
  title: String
  type: MessageType
  user: User
  userAvatar: String!
  userId: String
  userName: String
}

input MessageInput {
  """Either user._id or post._id"""
  componentId: String

  """Message Room ID"""
  messageRoomId: String

  """Content of the chat message"""
  text: String!

  """Title of the chat message"""
  title: String!

  """Type of the message USER or POST"""
  type: String
}

"""Chat room (direct or group), aligned with Prisma MessageRoom."""
type MessageRoom {
  _id: ID!
  avatar: JSON
  created: Date
  lastActivity: Date
  lastMessageTime: Date
  messageType: MessageType
  messages: [Message]
  post: Post
  postDetails: PostDetails
  postId: String
  title: String
  typingIndicators: [TypingIndicator]
  unreadMessages: Int
  users: [String]
  usersData: [User]
}

enum MessageType {
  POST
  SYSTEM
  USER
}

type Mutation {
  """ Accept buddy request """
  acceptBuddy(requestId: String!): BuddyRelationship!

  """ Add reaction to an action/post """
  addActionReaction(reaction: ReactionInput!): Reaction

  """ Add buddy request """
  addBuddy(userId: String!): BuddyRelationship!

  """ Create a new comment """
  addComment(comment: CommentInput!): Comment

  """ Add reaction to a chat message """
  addMessageReaction(reaction: ReactionInput!): Reaction

  """ Create a new post """
  addPost(post: PostInput!): Post

  """ Create a new quote """
  addQuote(quote: QuoteInput!): Quote

  """ Add or update a vote """
  addVote(vote: VoteInput!): Vote

  """ Approve a post (admin only) """
  approvePost(postId: String!, remove: Boolean, userId: String!): Post

  """ Block a user (idempotent; removes pending buddy requests) """
  blockUser(userId: String!): UserBlockStatus!

  """ Clear presence status (on logout) """
  clearPresence: Boolean

  """ Complete invite-based signup with Terms acceptance (token is not a session)
  """
  completeSignup(acceptedTermsVersion: String!, password: String!, token: String!, username: String!): User

  """ Create a new chat message """
  createMessage(message: MessageInput!): Message

  """ Create a chat room for a post """
  createPostMessageRoom(postId: String!): MessageRoom

  """ Create a tag """
  createTag(tag: TagInput!): Tag

  """ Decline buddy request """
  declineBuddy(requestId: String!): BuddyMutationResult!

  """ Delete an action/post reaction """
  deleteActionReaction(_id: String!): Boolean

  """ Delete a comment """
  deleteComment(commentId: String!): DeletedComment

  """ Delete a chat message """
  deleteMessage(messageId: String!): DeletedMessage

  """ Soft-delete a post """
  deletePost(postId: String!): DeletedPost

  """ Delete a quote """
  deleteQuote(quoteId: String!): DeletedQuote

  """ Delete a vote """
  deleteVote(voteId: String!): DeletedVote

  """ Disable a user account (admin only) """
  disableUser(userId: String!): User

  """ Enable a user account (admin only) """
  enableUser(userId: String!): User

  """ Follow or unfollow a user """
  followUser(action: String!, user_id: String!): User

  """ Send heartbeat to keep presence active """
  heartbeat: HeartbeatResponse

  """ Recalculate user reputation metrics """
  recalculateReputation(userId: String!): JSON

  """ Reject a post (admin only) """
  rejectPost(postId: String!, remove: Boolean, userId: String!): Post

  """ Remove a buddy, or withdraw a pending request """
  removeBuddy(userId: String!): BuddyMutationResult!

  """ Remove user notification """
  removeNotification(notificationId: String!): Notification

  """ Report a user account as a bot """
  reportBot(reporterId: String!, userId: String!): JSON

  """ Report a post """
  reportPost(postId: String!, userId: String!): Post

  """ Submit a user report """
  reportUser(reportUserInput: ReportUserInput!): JSON

  """ Request user access """
  requestUserAccess(requestUserAccessInput: RequestUserAccessInput!): User

  """ Send investor email """
  sendInvestorMail(email: String!): JSON

  """ Send password reset link email """
  sendPasswordResetEmail(email: String!): JSON

  """ Send a user invitation """
  sendUserInvite(email: String!): JSON

  """ Approve or reject user access invite (admin only) """
  sendUserInviteApproval(inviteStatus: String!, userId: String!): JSON

  """ Append activity event to Solid pod """
  solidAppendActivityEvent(input: ActivityEventInput!): Boolean

  """ Disconnect from Solid pod """
  solidDisconnect: Boolean

  """ Finish Solid connection authentication """
  solidFinishConnect(code: String!, redirectUri: String!, state: String!): SolidConnectResult

  """ Pull portable state from Solid pod """
  solidPullPortableState: PortableState

  """ Push portable state to Solid pod """
  solidPushPortableState(input: PortableStateInput!): Boolean

  """ Start Solid connection authorization flow """
  solidStartConnect(issuer: String!): SolidConnectResult

  """ Toggle voting capabilities on a post """
  toggleVoting(postId: String!): Post

  """ Unblock a user (idempotent) """
  unblockUser(userId: String!): UserBlockStatus!

  """ Update an existing action/post reaction """
  updateActionReaction(_id: String!, emoji: String!): Reaction

  """ Update a post's featured slot (admin only) """
  updateFeaturedSlot(featuredSlot: Int, postId: String!): Post

  """ Update messages as read in a room """
  updateMessageReadBy(messageRoomId: String!): [Message]

  """ Bookmark or unbookmark a post """
  updatePostBookmark(postId: String!, userId: String!): Post

  """ Update user presence status """
  updatePresence(presence: PresenceInput!): Presence

  """ Update an existing chat message reaction """
  updateReaction(_id: String!, emoji: String!): Reaction

  """ Update typing status in chat room """
  updateTyping(typing: TypingInput!): TypingResponse

  """ Update user profile details """
  updateUser(user: UserInput!): User

  """ Update user avatar image """
  updateUserAvatar(avatarQualities: JSON, user_id: String!): User

  """ Reset user password with token """
  updateUserPassword(password: String, token: String, username: String): JSON
}

"""User-facing notification (follow / upvote / comment / etc)."""
type Notification {
  _id: String
  created: Date
  label: String
  notificationType: NotificationType
  post: Post
  status: String
  user: User
  userBy: User
  userId: String
  userIdBy: String
}

enum NotificationType {
  COMMENT
  COMMENTED
  DOWNVOTED
  FOLLOW
  MENTION
  MESSAGE
  QUOTE
  SYSTEM
  UPVOTED
  VOTE
}

"""Mongoose ObjectId scalar type"""
scalar ObjectId

"""Cursor / offset pagination metadata returned alongside list queries."""
type Pagination {
  limit: Int
  offset: Int
  total_count: Int
}

type PortableState {
  collections: [JSON]
  version: String
}

input PortableStateInput {
  collections: [JSON]
  version: String
}

"""A user post, aligned with Prisma Post / Mongoose Post model."""
type Post {
  _id: String
  approvedBy: [String]
  attribution: String
  bookmarkedBy: [String]
  citationUrl: String
  comments: [Comment]
  created: Date
  creator: User
  dayPoints: Int
  deleted: Boolean
  downvotes: Int
  enable_voting: Boolean
  featuredSlot: Int
  messageRoom: MessageRoom
  pointTimestamp: String
  quotes: [Quote]
  rejectedBy: [String]
  reportedBy: [String]
  tagId: String
  text: String
  title: String
  upvotes: Int
  url: String
  userId: String
  votedBy: [String]
  votes: [Vote]
}

"""Inlined Post snapshot displayed with the MessageRoom that wraps it."""
type PostDetails {
  _id: ID
  text: String
  title: String
  url: String
  userId: ID
}

input PostInput {
  attribution: String
  citationUrl: String
  tagId: String!
  text: String!
  title: String!
  userId: String!
}

"""Paginated list of posts."""
type Posts {
  entities: [Post]
  pagination: Pagination
}

"""User presence status (online / away / dnd / offline / invisible)."""
type Presence {
  _id: String!
  lastHeartbeat: Date!
  lastSeen: Date
  preferredStatus: PresenceStatus
  preferredStatusMessage: String
  status: PresenceStatus!
  statusMessage: String
  user: User
  userId: String!
}

"""Input for updating presence"""
input PresenceInput {
  status: String!
  statusMessage: String
}

enum PresenceStatus {
  away
  dnd
  invisible
  offline
  online
}

"""Presence change payload delivered over subscriptions."""
type PresenceUpdate {
  lastSeen: Date
  status: PresenceStatus!
  statusMessage: String
  userId: String!
}

type Query {
  """ This will query the action Reactions"""
  actionReactions(actionId: String!): [Reaction]

  """ This will give the public news feed """
  activities(activityEvent: JSON, endDateRange: String, limit: Int, offset: Int, searchKey: String, startDateRange: String, user_id: String): Activities

  """ Pending buddy requests sent to or by the current user"""
  buddyRequests: [BuddyRelationship!]!

  """ This will query duplicate email"""
  checkDuplicateEmail(email: String!): JSON

  """ Posts selected for homepage carousel """
  featuredPosts(approved: Boolean, deleted: Boolean, endDateRange: String, friendsOnly: Boolean, interactions: Boolean, limit: Int, offset: Int, searchKey: String, sortOrder: String, startDateRange: String, tagId: String, userId: String): Posts

  """ Get users reported as bots (admin only) """
  getBotReportedUsers(limit: Int, sortBy: String): [User]

  """ Get buddy list with presence information"""
  getBuddyList: [BuddyWithPresence!]!

  """ Get user presence by user ID"""
  getPresence(userId: String!): Presence

  """ Get roster entries"""
  getRoster: [Roster]

  """ Get typing users in a message room"""
  getTypingUsers(messageRoomId: String!): [TypingIndicator]

  """ This will query the user follow info """
  getUserFollowInfo(filter: String, username: String): JSON

  """ Get user invites """
  getUserInvites(status: String, userId: String!): [UserInvite]

  """ Get user reports """
  getUserReports(status: String, userId: String!): [UserReport]

  """ Get user reputation information """
  getUserReputation(userId: String!): UserReputation

  """ Hello world check """
  hello: String

  """ Get latest quotes """
  latestQuotes(limit: Int!): [Quote!]!

  """ This will query the message Reactions"""
  messageReactions(messageId: String!): [Reaction]

  """ This will query the user message room"""
  messageRoom(otherUserId: String!): MessageRoom

  """ This will query the list user message rooms"""
  messageRooms: [MessageRoom]

  """ This will query the user messages by Message Room ID"""
  messages(messageRoomId: String!): [Message]

  """ This will query user notifications"""
  notifications: [Notification]

  """ This will query a post """
  post(postId: String!): Post

  """ This will query a post message room"""
  postMessageRoom(postId: String!): MessageRoom

  """ This will query the list of posts """
  posts(approved: Boolean, deleted: Boolean, endDateRange: String, friendsOnly: Boolean, interactions: Boolean, limit: Int, offset: Int, searchKey: String, sortOrder: String, startDateRange: String, tagId: String, userId: String): Posts

  """ Search content by text """
  searchContent(text: String!): [Content]

  """ Search creators by name """
  searchCreator(text: String!): [Creator]

  """ This will search for users by username or name """
  searchUser(queryName: String!): [User]

  """ Get Solid connection status """
  solidConnectionStatus: SolidConnectionStatus!

  """ Status of server """
  status: String

  """ Get a specific tag by ID """
  tag(tagId: String!): Tag

  """ Get all tags """
  tags(created: String, key: String, limit: Int, title: String): [Tag]

  """ This will query the top posts (alias for posts) """
  topPosts(endDateRange: String, friendsOnly: Boolean, interactions: Boolean, limit: Int!, offset: Int!, searchKey: String!, sortOrder: String, startDateRange: String, userId: String): Posts

  """ This will query the user """
  user(creatorId: String, user_id: String, username: String): User

  """ Block state between the current user and another user"""
  userBlockStatus(userId: String!): UserBlockStatus!

  """ This will query the list of user invite requests """
  userInviteRequests: [UserInvite]

  """ This will query the list of available users (Admin only) """
  users(limit: Int, offset: Int): [User]

  """ Verify a limited-purpose invite signup token (not a session)"""
  verifyInviteSignupToken(token: String!): JSON

  """ This will query user info if token is valid"""
  verifyUserPasswordResetToken(token: String!): JSON
}

"""A quoted excerpt of a post."""
type Quote {
  _id: String
  created: Date
  deleted: Boolean
  endWordIndex: Int
  post: Post
  postId: ID
  quote: String
  quoted: String
  quoter: String
  startWordIndex: Int
  user: User
}

input QuoteInput {
  endWordIndex: Int!
  postId: String!
  quote: String!
  quoted: String!
  quoter: String!
  startWordIndex: Int!
}

"""Emoji reaction on a message or action (vote/comment/etc)."""
type Reaction {
  _id: String
  actionId: String
  created: String
  emoji: String
  message: Message
  messageId: String
  user: User
  userId: String
}

input ReactionInput {
  actionId: String
  emoji: String
  messageId: String
  userId: String
}

"""Per-user read receipt for a message."""
type ReadByDetailedEntry {
  readAt: Date
  userId: String
}

enum ReportReason {
  fake_account
  harassment
  inappropriate_content
  other
  spam
}

enum ReportSeverity {
  critical
  high
  low
  medium
}

enum ReportStatus {
  dismissed
  pending
  resolved
  reviewed
}

input ReportUserInput {
  _reportedUserId: String!
  description: String
  reason: String!
  severity: String
}

type ReputationHistory {
  activityScore: Int!
  conductScore: Int!
  date: String!
  inviteNetworkScore: Int!
  overallScore: Int!
  reason: String!
}

type ReputationMetrics {
  averageInviteeReputation: Int!
  totalComments: Int!
  totalDownvotes: Int!
  totalInvitesAccepted: Int!
  totalInvitesDeclined: Int!
  totalInvitesSent: Int!
  totalPosts: Int!
  totalReportsReceived: Int!
  totalReportsResolved: Int!
  totalUpvotes: Int!
}

input RequestUserAccessInput {
  email: String!
}

"""Buddy-list entry linking two users with a relationship status."""
type Roster {
  _id: String!
  buddy: User
  buddyId: String!
  created: Date!
  initiatedBy: String!
  presence: Presence
  status: RosterStatus!
  updated: Date!
  user: User
  userId: String!
}

input RosterInput {
  buddyId: String!
}

enum RosterStatus {
  accepted
  blocked
  declined
  pending
}

input SendUserInviteInput {
  email: String!
}

type SolidConnectResult {
  authorizationUrl: String
  issuer: String
  message: String
  success: Boolean
  webId: String
}

type SolidConnectionStatus {
  connected: Boolean
  issuer: String
  lastSyncAt: String
  webId: String
}

type Subscription {
  message(messageRoomId: String!): Message
  notification(userId: String!): Notification
  presence(userId: String): PresenceUpdate
  typing(messageRoomId: String!): TypingIndicator
}

"""Tag / community, aligned with Prisma Tag."""
type Tag {
  _id: String!
  adminIds: [String!]
  adminUsers: [User]
  allowedUserIds: [String!]
  allowedUsers: [User]
  created: String!
  creator: User
  creatorId: String!
  description: String!
  pendingUsers: [User]
  privacy: TagPrivacy!
  rosters: [Roster]
  title: String!
  url: String!
}

input TagInput {
  creatorId: String!
  description: String!
  privacy: String!
  title: String!
  url: String
}

enum TagPrivacy {
  private
  public
  restricted
}

"""Live typing indicator broadcast within a message room."""
type TypingIndicator {
  isTyping: Boolean!
  messageRoom: MessageRoom
  messageRoomId: String!
  timestamp: Date!
  user: User
  userId: String!
}

input TypingInput {
  isTyping: Boolean!
  messageRoomId: String!
}

"""Response payload for updateTyping mutation."""
type TypingResponse {
  success: Boolean!
}

"""
Registered user account, aligned with Prisma User / Mongoose User model.
"""
type User {
  _followersId: [String]
  _followingId: [String]
  _id: String!
  _votesId: String
  _wallet: String
  accountStatus: AccountStatus
  admin: Boolean
  avatar: JSON
  bio: String
  botReports: Int
  comments: [Comment]
  contributorBadge: Boolean
  createdTags: [Tag]
  downvotes: Int
  email: String
  favorited: Int
  joined: String
  lastBotReportDate: String
  memberOfTags: [Tag]
  name: String
  posts: [Post]
  presence: Presence
  reputation: UserReputation
  rosters: [Roster]
  themePreference: String
  tokens: Int
  upvotes: Int
  userId: ID
  username: String
  votes: [Vote]
}

"""Block state between the current user and another user."""
type UserBlockStatus {
  blockedByMe: Boolean!
  blockedMe: Boolean!
  userId: String!
}

input UserInput {
  _id: String!
  avatar: String
  bio: String
  contributorBadge: Boolean
  email: String
  name: String
  password: String
  quotes: [String]
  themePreference: String
  username: String
}

"""Outstanding invite record for a prospective user."""
type UserInvite {
  _id: String!
  _userId: String
  email: String!
  joined: Date
  status: String
}

type UserReport {
  _id: String!
  _reportedUserId: String!
  _reporterId: String!
  adminNotes: String
  createdAt: String!
  description: String
  reason: ReportReason!
  reportedUser: User
  reporter: User
  severity: ReportSeverity!
  status: ReportStatus!
  updatedAt: String!
}

"""
Aggregated reputation score for a user across invite/conduct/activity axes.
"""
type UserReputation {
  _id: String!
  _userId: String!
  activityScore: Int!
  conductScore: Int!
  createdAt: String!
  history: [ReputationHistory!]!
  inviteNetworkScore: Int!
  lastCalculated: String!
  metrics: ReputationMetrics!
  overallScore: Int!
  updatedAt: String!
}

"""User vote (up/down) on a post, aligned with Prisma Vote."""
type Vote {
  _id: String
  content: String
  created: Date
  deleted: Boolean
  endWordIndex: Int
  post: Post
  postId: String
  startWordIndex: Int
  tags: String
  type: VoteType
  user: User
  userId: String
}

input VoteInput {
  content: String
  endWordIndex: Int!
  postId: String!
  startWordIndex: Int!
  tags: String!
  type: String!
  userId: String
}

enum VoteType {
  down
  up
}