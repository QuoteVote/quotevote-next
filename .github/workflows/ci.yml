name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - staging

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./quotevote-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: quotevote-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

      # Every frontend GraphQL document must validate against this backend's
      # schema and call root fields that have a resolver. Known gaps are listed
      # with their issue in app/data/utils/frontendContract.ts.
      - name: Check frontend GraphQL contract
        run: pnpm check:contract

      - name: Run tests with coverage
        run: pnpm test -- --coverage --coverageReporters=text --coverageReporters=lcov

      # The Prisma integration tests (votes, unique indexes, models) need real transactions,
      # so they run against a throwaway single-node replica set, one file at a time (#747).
      - name: Start MongoDB for the integration tests
        run: |
          docker run -d --name mongo-it -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo-it mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && break
            sleep 1
          done
          docker exec mongo-it mongosh --quiet --eval 'rs.initiate()'
          for i in $(seq 1 30); do
            docker exec mongo-it mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break
            sleep 1
          done

      - name: Run the Prisma integration tests
        env:
          DATABASE_URL: mongodb://localhost:27017/quotevote_ci_test?replicaSet=rs0&directConnection=true
        run: pnpm test:prisma

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./quotevote-backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Build
        run: pnpm build

  backend-container:
    name: Backend container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only pull requests that change the backend or this workflow build the image.
      - name: Check for backend changes
        id: changes
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- quotevote-backend .github/workflows/ci.yml; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend changes, container build skipped"
          else
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./quotevote-backend
          tags: quotevote-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # A throwaway single-node replica set, the same shape as production.
      - name: Start MongoDB
        if: steps.changes.outputs.backend == 'true'
        run: |
          docker run -d --name mongo --network host mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate()'

      - name: Start the container and wait for the health check
        if: steps.changes.outputs.backend == 'true'
        run: |
          MONGO_URI='mongodb://localhost:27017/quotevote_ci?directConnection=true'
          docker run -d --name backend --network host \
            -e MONGO_URI="$MONGO_URI" -e DATABASE_URL="$MONGO_URI" \
            -e JWT_SECRET=ci-only-secret -e CLIENT_URL=http://localhost:3000 \
            quotevote-backend:ci
          for i in $(seq 1 60); do
            if curl -fs http://localhost:4000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "::error::/health did not return 200 within 60 seconds"
          docker logs backend
          exit 1

      - name: Check the server shuts down cleanly
        if: steps.changes.outputs.backend == 'true'
        run: |
          start=$(date +%s)
          docker stop -t 15 backend
          took=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' backend)
          echo "Stopped in ${took}s with exit code $code"
          if [ "$code" != "0" ] || [ "$took" -ge 15 ]; then
            docker logs backend
            exit 1
          fi

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./quotevote-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: quotevote-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

      # Catches documents selecting fields the deployed API does not expose,
      # which type-check cannot see and which fail at runtime with HTTP 400.
      # The snapshot is the current API's schema. Pull requests into staging
      # target the new backend, and Backend CI's contract check covers them.
      - name: Validate GraphQL documents against schema snapshot
        if: github.base_ref != 'staging'
        run: pnpm validate:graphql

      - name: Run tests
        run: pnpm test

      # Otherwise the production build only runs on Vercel: the E2E job below
      # skips itself without its secret. The build never calls the API, so
      # placeholder URLs are enough.
      - name: Build
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:4000
          NEXT_PUBLIC_GRAPHQL_ENDPOINT: http://localhost:4000/graphql
        run: pnpm build

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest

    steps:
      # Run at repo root — quotevote-frontend/ does not exist until after checkout.
      # The specs create accounts, posts and votes, so they only run against a test backend:
      # E2E_API_URL must be set, and the production API is refused.
      - name: Check E2E credentials and test backend
        id: e2e_gate
        env:
          E2E_AUTHOR_PASSWORD: ${{ secrets.E2E_AUTHOR_PASSWORD }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
        run: |
          if [ -z "$E2E_AUTHOR_PASSWORD" ] || [ -z "$E2E_API_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E skipped — set the E2E_AUTHOR_PASSWORD and E2E_API_URL (a test backend) repository secrets to enable"
            exit 0
          fi
          host=$(node -e 'console.log(new URL(process.argv[1]).hostname)' "$E2E_API_URL")
          if [ "$host" = "api.quote.vote" ]; then
            echo "::error::E2E_API_URL points at the production API. Use a test backend."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.e2e_gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.e2e_gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: steps.e2e_gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: quotevote-frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.e2e_gate.outputs.enabled == 'true'
        working-directory: ./quotevote-frontend
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install Playwright browsers
        if: steps.e2e_gate.outputs.enabled == 'true'
        working-directory: ./quotevote-frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        if: steps.e2e_gate.outputs.enabled == 'true'
        working-directory: ./quotevote-frontend
        env:
          # The test backend checked above; no fallback.
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.E2E_API_URL }}
          NEXT_PUBLIC_GRAPHQL_ENDPOINT: ${{ secrets.E2E_GRAPHQL_ENDPOINT }}
        run: pnpm build

      - name: Run Playwright tests
        if: steps.e2e_gate.outputs.enabled == 'true'
        working-directory: ./quotevote-frontend
        env:
          CI: true
          E2E_AUTHOR_USERNAME: ${{ secrets.E2E_AUTHOR_USERNAME || 'authorUser' }}
          E2E_AUTHOR_PASSWORD: ${{ secrets.E2E_AUTHOR_PASSWORD }}
          E2E_PEER_USERNAME: ${{ secrets.E2E_PEER_USERNAME }}
          E2E_PUBLIC_GROUP_NAME: ${{ secrets.E2E_PUBLIC_GROUP_NAME || 'QA' }}
          # The specs talk to the same test backend as the build.
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_GRAPHQL_ENDPOINT: ${{ secrets.E2E_GRAPHQL_ENDPOINT }}
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_SKIP_WEBSERVER: true
        run: |
          pnpm start &
          pnpm exec wait-on http://localhost:3000 --timeout 120000
          pnpm test:e2e

      - name: Upload Playwright report
        if: failure() && steps.e2e_gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: quotevote-frontend/playwright-report/
          retention-days: 7

